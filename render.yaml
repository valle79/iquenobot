databases:
  - name: iquenobot-db
    plan: free
    databaseName: iquenobot

services:
  # Sistema IquenoBot (backend + frontend CRM integrado)
  - type: web
    name: iquenobot
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.prod
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker

      - key: DATASOURCE_URL
        fromDatabase:
          name: iquenobot-db
          property: connectionString

      - key: DATASOURCE_USERNAME
        fromDatabase:
          name: iquenobot-db
          property: user

      - key: DATASOURCE_PASSWORD
        fromDatabase:
          name: iquenobot-db
          property: password

      - key: JWT_SECRET
        generateValue: true

      - key: CRYPTO_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        value: "*"

  # Landing
  - type: web
    name: iquenobot-landing
    runtime: docker
    plan: free
    dockerfilePath: iquenobot-landing/Dockerfile
    dockerContext: iquenobot-landing
    healthCheckPath: /
