services:
  - type: web
    name: iquenobot
    env: docker
    dockerfilePath: Dockerfile.prod
    healthCheckPath: /api/v1/ping
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: DATASOURCE_URL
        sync: false
      - key: DATASOURCE_USERNAME
        sync: false
      - key: DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRYPTO_SECRET
        generateValue: true
