spring.application.name=iquenobot

# Active profile (will be overridden by SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/iquenobot}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql

# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-change-in-production}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Server Configuration
server.port=${SERVER_PORT:8085}
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.iquenobot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAI / Groq (OpenAI-compatible) Configuration (optional)
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-4}
openai.api.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Evolution API Configuration (optional)
evolution.api.url=${EVOLUTION_API_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}

# Upload Configuration
upload.path=${UPLOAD_PATH:uploads}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}
